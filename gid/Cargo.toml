[package]
name = "gid"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
getrandom.workspace = true
imbl = "7"
# Strips the proofs from verified source, such as position.rs, in ordinary
# builds; `make verify` checks them. See docs/verification.md.
verus_builtin_macros.workspace = true

[lints.rust]
# Verus sets verus_only while it verifies; ordinary builds never do.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
