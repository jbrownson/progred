[package]
name = "puri-vello"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Headless rendering and readback, for pixel tests here and in dependent
# crates, and for progred's pictures of what it draws: those its structural
# copies carry and its control session's screenshots.
capture = ["dep:pollster"]

[dependencies]
pollster = { workspace = true, optional = true }
puri.workspace = true
vello.workspace = true

[dev-dependencies]
nalgebra = "0.35"
png = "0.18.1"
