[package]
name = "fidget-jit"
description = "Native JIT compiler for Fidget"
readme = "README.md"
version = "0.5.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mkeeter/fidget"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
rust-version = "1.95"

[dependencies]
fidget-core = "=0.5.1"
workspace-hack = "0.1"

arrayvec = "0.7"
dynasmrt = "5.1"
static_assertions = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
fidget-core = { version = "=0.5.1", features = ["eval-tests"] }
