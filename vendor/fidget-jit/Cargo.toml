[package]
name = "fidget-jit"
description = "Native JIT compiler for Fidget"
readme = "README.md"
version = "0.5.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mkeeter/fidget"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
rust-version = "1.92"

[dependencies]
fidget-core = { git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6" }
workspace-hack = { git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6" }
arrayvec = "0.7"
dynasmrt = "5.0"
static_assertions = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
fidget-core = { git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6", features = ["eval-tests"] }
