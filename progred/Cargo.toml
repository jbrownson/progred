[package]
name = "progred"
version = "0.1.0"
edition = "2024"

[features]
cam-profile = []
layout-profile = []
mesh-experiment = []
gpu-experiment = ["dep:fidget-wgpu", "fidget-wgpu/experimental-spills"]

[[example]]
name = "cam_profile"
required-features = ["cam-profile"]

[[example]]
name = "orbit_profile"
required-features = ["cam-profile"]

[dependencies]
grap = { path = "../grap" }
gid.workspace = true
incremental.workspace = true
measured = { path = "../ui/measured" }
puri.workspace = true
puri-widgets.workspace = true
fidget-engine = { package = "fidget", git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6", default-features = false, features = ["raster", "mesh"] }
nalgebra = "0.35"
uig.workspace = true
kurbo.workspace = true
peniko.workspace = true
parley.workspace = true
winit = "0.30.13"
ui-events.workspace = true
ui-events-winit = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
web-time = "1.1"
puri-vello = { path = "../ui/puri-vello" }
vello.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fidget-wgpu = { path = "../vendor/fidget-wgpu", optional = true }
fidget-engine = { package = "fidget", git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6", default-features = false, features = ["wgpu"] }
pollster.workspace = true

# The patched AArch64 JIT is tested on Apple Silicon macOS. Other targets retain VM.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fidget-engine = { package = "fidget", git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6", default-features = false, features = ["jit"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
clipboard-rs = "0.3.3"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { workspace = true, features = ["wasm_js"] }
puri-web = { path = "../ui/puri-web" }
wasm-bindgen.workspace = true
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = [
    "console",
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAMetalLayer"] }
raw-window-metal = "1.1.0"

[dev-dependencies]
base64 = "0.22.1"
png = "0.18.1"
skrifa.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
futures-intrusive = "0.5"
