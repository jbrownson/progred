[package]
name = "progred"
version = "0.1.0"
edition = "2024"

[features]
layout-profile = []

[dependencies]
grap = { path = "../grap" }
gid.workspace = true
measured = { path = "../ui/measured" }
puri.workspace = true
puri-widgets.workspace = true
fidget-engine = { package = "fidget", version = "=0.5.0", default-features = false, features = ["raster"] }
nalgebra = "0.35"
uig.workspace = true
kurbo.workspace = true
peniko.workspace = true
parley.workspace = true
winit = "0.30.13"
ui-events.workspace = true
ui-events-winit = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fidget-engine = { package = "fidget", version = "=0.5.0", default-features = false, features = ["wgpu"] }
pollster.workspace = true
puri-vello = { path = "../ui/puri-vello" }
vello.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
clipboard-rs = "0.3.3"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { workspace = true, features = ["wasm_js"] }
puri-web = { path = "../ui/puri-web" }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAMetalLayer"] }
raw-window-metal = "1.1.0"

[dev-dependencies]
skrifa.workspace = true
