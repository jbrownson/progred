[package]
name = "progred"
version = "0.1.0"
edition = "2024"

[dependencies]
grap = { path = "../grap" }
progred-libraries = { path = "../libraries" }
progred-display = { path = "../display" }
gid = { path = "../gid" }
measured = { path = "../ui/measured" }
puri = { path = "../ui/puri" }
uig = { path = "../ui/uig" }
kurbo = "0.13.1"
peniko = "0.6.1"
parley = "0.9.0"
winit = "0.30.13"
ui-events = "0.3"
ui-events-winit = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clipboard-rs = "0.3.3"
pollster = "0.4.0"
puri-vello = { path = "../ui/puri-vello" }
rfd = "0.17"
vello = "0.9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
puri-web = { path = "../ui/puri-web" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.15", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAMetalLayer"] }
raw-window-metal = "1.1.0"

[dev-dependencies]
skrifa = "0.42.1"
