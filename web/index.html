<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <title>Progred</title>
    <link rel="icon" href="./icon.svg" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        color-scheme: light;
        background: #ffffff;
      }

      html[data-theme="dark"], html[data-theme="dark"] body {
        color-scheme: dark;
        background: #151b2c;
      }
      html[data-theme="dark"] #loading { color: #a0aec9; }

      body {
        min-height: 100dvh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #666;
        font: 15px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="progred"></canvas>
    <div id="loading">Loading Progred…</div>
    <script type="module">
      import init, * as wasm from "./pkg/progred.js";
      import { startWorker } from "./worker-host.js";
      import { commandIsMeta } from "./platform.mjs";
      import { isTheme, savedTheme } from "./theme.mjs";
      import { forwardModifiers } from "./modifiers.mjs";

      const loading = document.querySelector("#loading");
      const fail = (error) => {
        console.error(error);
        loading.hidden = false;
        loading.style.display = "grid";
        loading.textContent = `Progred could not continue: ${error.message}. Reload to retry.`;
      };
      try {
        const params = new URLSearchParams(location.search);
        let theme = params.get("theme") ?? savedTheme(window);
        if (!isTheme(theme)) throw new Error("theme must be 'light' or 'dark'");
        let ready = false;
        document.documentElement.dataset.theme = theme;
        window.addEventListener("message", (event) => {
          if (event.origin === location.origin && event.source === window.parent
              && event.data?.type === "progred:theme" && isTheme(event.data.theme)) {
            theme = event.data.theme;
            document.documentElement.dataset.theme = theme;
            if (ready) wasm.set_theme(theme);
          }
        });
        const canvas = document.querySelector("#progred");
        const wheel = params.get("wheel") ?? "editor";
        if (wheel === "page") {
          document.documentElement.style.overscrollBehavior = "auto";
          document.body.style.overscrollBehavior = "auto";
          // Keep wheel input out of winit without cancelling browser scrolling.
          canvas.addEventListener("wheel", (event) => event.stopImmediatePropagation(),
            { capture: true, passive: true });
        } else if (wheel !== "editor") {
          throw new Error("wheel must be 'editor' or 'page'");
        }
        const documentUrl = params.get("document");
        let source;
        if (documentUrl !== null) {
          const response = await fetch(new URL(documentUrl, location.href));
          if (!response.ok) throw new Error(`Could not load the example (${response.status})`);
          source = await response.text();
        }
        if (!crossOriginIsolated) throw new Error("This editor needs an HTTPS page with cross-origin isolation enabled by its host");
        await init();
        await startWorker(wasm, new URL("./pkg/progred.js", location.href).href,
          wasm.computation_finished, fail,
          params.has("threads") ? Number(params.get("threads")) : undefined);
        const renderer = await wasm.prepare_renderer(canvas);
        console.info(`Progred presentation: ${renderer}; ${wasm.worker_threads()} render workers`);
        const channel = params.get("observe");
        const onChange = channel === null ? undefined : (state) => {
          window.parent.postMessage({ type: "progred:change", channel, state: JSON.parse(state) }, location.origin);
        };
        wasm.start_editor(source, params.get("menu") !== "hidden", onChange,
          params.get("libraries") ?? undefined, params.get("tutorial-slots") ?? undefined,
          commandIsMeta(navigator.platform), theme);
        forwardModifiers(canvas, window, wasm.browser_modifiers_changed);
        ready = true;
        window.parent.postMessage({ type: "progred:ready" }, location.origin);
        window.addEventListener("focus", wasm.browser_focus_changed);
        window.addEventListener("blur", wasm.browser_focus_changed);
        wasm.browser_focus_changed();
        loading.style.display = "none";
      } catch (error) {
        fail(error instanceof Error ? error : new Error(String(error)));
      }
    </script>
  </body>
</html>
