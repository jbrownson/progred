<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f6f8" />
    <title>Progred</title>
    <link rel="icon" href="./icon.svg" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f6f6f8;
      }

      body {
        min-height: 100dvh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #666;
        font: 15px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="progred"></canvas>
    <div id="loading">Loading Progred…</div>
    <script type="module">
      import init from "./pkg/progred.js";

      await init();
      document.querySelector("#loading")?.remove();
    </script>
  </body>
</html>
