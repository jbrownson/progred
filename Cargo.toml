[workspace]
resolver = "3"
members = [
    "gid",
    "grap",
    "incremental",
    "progred",
    "ui/measured",
    "ui/puri",
    "ui/puri-widgets",
    "ui/puri-vello",
    "ui/puri-web",
    "ui/uig",
    "vendor/fidget-jit",
    "vendor/fidget-core",
    "vendor/fidget-raster",
    "vendor/fidget-wgpu",
]

[workspace.package]
license = "MIT"

# Local patches against the pinned upstream revision; see vendor/README.md.
[patch."https://github.com/mkeeter/fidget"]
fidget-core = { path = "vendor/fidget-core" }
fidget-jit = { path = "vendor/fidget-jit" }
fidget-raster = { path = "vendor/fidget-raster" }
fidget-wgpu = { path = "vendor/fidget-wgpu" }

[workspace.dependencies]
fidget-engine = { package = "fidget", git = "https://github.com/mkeeter/fidget", rev = "0c89e87e1b3a6d15cc0976ab6ff05a09f9cf91d6", default-features = false }
getrandom = "0.3"
gid = { path = "gid" }
incremental = { path = "incremental" }
kurbo = "0.13.1"
parley = "0.9.0"
peniko = "0.6.1"
pollster = "0.4"
puri = { path = "ui/puri" }
puri-widgets = { path = "ui/puri-widgets" }
serde = "1.0"
serde_json = "1.0"
skrifa = "0.42.1"
ui-events = "0.3"
uig = { path = "ui/uig" }
vello = "0.9.0"
wasm-bindgen = "0.2"
web-sys = "0.3"
