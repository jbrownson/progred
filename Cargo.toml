# Whole-program optimization; ~0-1% on the Grap interpreter bench
# (2026-08) for ~2x release link time. Re-evaluate if release builds
# drag — the fallback is scoping it to a shipping profile. Profile-
# guided optimization is deliberately unset: trained on today's few
# examples it would overfit them; set it up for shipping builds once
# the example set diversifies.
[profile.release]
lto = true
codegen-units = 1

[workspace]
resolver = "3"
members = [
    "gid",
    "display",
    "grap",
    "libraries",
    "experiments/rust-wasm-projection",
    "progred",
    "ui/measured",
    "ui/puri",
    "ui/puri-vello",
    "ui/puri-web",
    "ui/uig",
]
