# Whole-program optimization is reserved for distributed builds: it
# measured ~0-1% on the Grap interpreter bench (2026-08) while roughly
# doubling link time. Profile-guided optimization remains unset until
# the example set is broad enough to provide representative training.
[profile.shipping]
inherits = "release"
lto = true
codegen-units = 1

[workspace]
resolver = "3"
members = [
    "gid",
    "display",
    "grap",
    "libraries",
    "experiments/rust-wasm-projection",
    "progred",
    "ui/measured",
    "ui/puri",
    "ui/puri-vello",
    "ui/puri-web",
    "ui/uig",
]
