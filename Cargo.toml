# Whole-program optimization is reserved for distributed builds: it
# measured ~0-1% on the Grap interpreter bench (2026-08) while roughly
# doubling link time. Profile-guided optimization remains unset until
# the example set is broad enough to provide representative training.
[profile.shipping]
inherits = "release"
lto = true
codegen-units = 1

[workspace]
resolver = "3"
members = [
    "gid",
    "grap",
    "progred",
    "ui/measured",
    "ui/puri",
    "ui/puri-widgets",
    "ui/puri-vello",
    "ui/puri-web",
    "ui/uig",
]

[workspace.dependencies]
getrandom = "0.3"
gid = { path = "gid" }
kurbo = "0.13.1"
parley = "0.9.0"
peniko = "0.6.1"
pollster = "0.4"
puri = { path = "ui/puri" }
puri-widgets = { path = "ui/puri-widgets" }
serde = "1.0"
serde_json = "1.0"
skrifa = "0.42.1"
ui-events = "0.3"
uig = { path = "ui/uig" }
vello = "0.9.0"
wasm-bindgen = "0.2"
web-sys = "0.3"
