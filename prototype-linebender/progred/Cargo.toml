[package]
name = "progred"
version = "0.1.0"
edition = "2024"

[dependencies]
grap = { path = "../grap" }
grap-error = { path = "../grap/libraries/grap-error" }
grap-f64 = { path = "../grap/libraries/grap-f64" }
grap-geometry = { path = "../grap/libraries/grap-geometry" }
progred-graph = { path = "../graph" }
progred-isa = { path = "../graph/conventions/progred-isa" }
progred-name = { path = "../graph/conventions/progred-name" }
progred-text = { path = "../graph/conventions/progred-text" }
im = "15"
puri = { path = "../ui/puri" }
puri-vello = { path = "../ui/puri-vello" }
vello = "0.9.0"
parley = "0.9.0"
winit = "0.30.13"
pollster = "0.4.0"
ui-events = "0.3"
ui-events-winit = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
clipboard-rs = "0.3.3"
muda = "0.15"

[dev-dependencies]
skrifa = "0.42.1"
